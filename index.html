<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Exploration Timeline</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>Space Race</h1>
        </div>
    </header>
    <main>
        <section id="timeline">
            <article class="event" data-year="1977">
                <figure>
                    <img src="Voyager.jpg" alt="Voyager Spacecraft">
                    <figcaption>Voyager 1 Launch (1977)</figcaption>
                </figure>

                <h3>1977: Voyager Missions Begin</h3>
                <p>NASA launches Voyager 1 and 2 to explore the outer solar system.</p>
            </article>
        </section>
    </main>

    <div id="modal">
        <!-- For Future pop-up content-->
    </div>

</body>
</html>
